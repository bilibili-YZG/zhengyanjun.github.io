<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>靶场突围 · 3D射击</title>
<style>
:root{--card:#fff;--ink:#14213d;--sub:#51607f;--ac:#0a8fb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#141c33;--ink:#eaf1ff;--sub:#9fb0d3;--ac:#4fd8f5}}
:root[data-theme="dark"]{--card:#141c33;--ink:#eaf1ff;--sub:#9fb0d3;--ac:#4fd8f5}
html,body{height:100%;margin:0;overflow:hidden;background:#070b16;font-family:"Noto Sans SC","PingFang SC","Hiragino Sans",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px 16px;color:#eaf1ff;pointer-events:none;font-size:15px;text-shadow:0 1px 3px #000}
#hud b{font-size:26px;font-variant-numeric:tabular-nums}
#hp{width:150px;height:8px;border-radius:4px;background:#ffffff30;overflow:hidden;margin-top:6px}
#hpf{height:100%;width:100%;background:#4fd8f5;transition:width .15s}
#ammo{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:#eaf1ff;font-size:22px;text-shadow:0 1px 3px #000;pointer-events:none}
#xh{position:fixed;left:50%;top:50%;width:30px;height:30px;margin:-17px 0 0 -17px;pointer-events:none;border:2px solid #fff;border-radius:50%;opacity:.85;will-change:transform}
#xh:after{content:"";position:absolute;left:12px;top:12px;width:6px;height:6px;border-radius:50%;background:#ff6b81}
#rd{position:fixed;left:16px;top:calc(88px + env(safe-area-inset-top,0px));width:96px;height:96px;pointer-events:none}#fb{display:none;position:fixed;right:20px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;border:2px solid #fff9;background:#ff6b8199;color:#fff;font-size:16px}#fl{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px #ff2f4f;opacity:0;transition:opacity .25s}
#rl{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:12px 18px;border-radius:10px;border:1px solid #fff6;background:#0008;color:#fff;font-size:15px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050913b8}
.card{background:var(--card);color:var(--ink);padding:28px 30px;border-radius:14px;max-width:min(420px,88vw);text-align:center;line-height:1.7}
.card h1{margin:0 0 6px;font-size:28px}.card p{margin:6px 0;color:var(--sub);font-size:14px}
.card button{margin-top:14px;padding:12px 30px;border:0;border-radius:10px;background:var(--ac);color:#04121a;font-size:17px;font-weight:700;cursor:pointer}
.card button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div>得分<br><b id="sc">0</b></div><div style="text-align:center">第 <b id="wv">1</b> 波<br><span id="cb"></span></div><div style="text-align:right">最高 <span id="bs">0</span><div id="hp"><div id="hpf"></div></div></div></div>
<div id="ammo"><b id="am">15</b> / 15</div>
<button id="rl" type="button">换弹 R</button><button id="fb" type="button">开火</button>
<canvas id="rd" width="96" height="96"></canvas><div id="xh"></div><div id="fl"></div>
<div id="menu"><div class="card"><h1 id="mt">靶场突围</h1><p id="ms">守住阵地，别让目标靠近你。</p>
<p>点击开始后鼠标会锁定在屏幕中央，移动鼠标即可 360° 转头，点击或按住开火，R 换弹，Esc 暂停。目标会从四面八方来，注意左上角雷达。<br>无法锁定鼠标或使用触屏时，拖动画面转头，用“开火”按钮（或空格）射击。</p>
<button id="go" type="button">开始游戏</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),T=THREE;
const cv=$('c'),R=new T.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
let pr=Math.min(devicePixelRatio||1,1.5);R.setPixelRatio(pr);
const S=new T.Scene();S.background=new T.Color(0x070b16);S.fog=new T.Fog(0x070b16,25,95);
const cam=new T.PerspectiveCamera(72,1,.1,120);cam.rotation.order='YXZ';cam.position.set(0,1.7,0);S.add(cam);
S.add(new T.HemisphereLight(0x8fb7ff,0x1a2038,.9));
const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(5,12,8);S.add(dl);
// 静态场景：地面网格 + 一圈实例化立柱（一次绘制调用）
const fl=new T.Mesh(new T.PlaneGeometry(220,220),new T.MeshBasicMaterial({color:0x0c1224}));fl.rotation.x=-Math.PI/2;S.add(fl);
const gr=new T.GridHelper(220,110,0x2a4f78,0x16264a);gr.position.y=.01;S.add(gr);
const N=70,pil=new T.InstancedMesh(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial({color:0x26335c}),N),m4=new T.Matrix4(),q=new T.Quaternion(),v3=new T.Vector3(),sc3=new T.Vector3();
for(let i=0;i<N;i++){const a=Math.random()*6.283,r=60+Math.random()*40,h=4+Math.random()*22;v3.set(Math.cos(a)*r,h/2,-Math.abs(Math.sin(a))*r-8);sc3.set(3+Math.random()*5,h,3+Math.random()*5);m4.compose(v3,q,sc3);pil.setMatrixAt(i,m4)}
pil.matrixAutoUpdate=false;pil.updateMatrix();S.add(pil);
// 枪模
const gun=new T.Group(),mD=new T.MeshLambertMaterial({color:0x2b3350}),mL=new T.MeshLambertMaterial({color:0x9aa8c8}),mS=new T.MeshLambertMaterial({color:0x3d5a80}),mG=new T.MeshBasicMaterial({color:0x4fd8f5});
const add=(g,m,x,y,z,par)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(par||gun).add(o);return o};
add(new T.BoxGeometry(.09,.08,.46),mD,0,0,0);
const slide=add(new T.BoxGeometry(.085,.07,.42),mL,0,.07,-.02);
add(new T.BoxGeometry(.012,.022,.02),mG,0,.045,-.19,slide);add(new T.BoxGeometry(.03,.02,.02),mD,0,.045,.17,slide);
add(new T.CylinderGeometry(.02,.02,.16,8),mD,0,.07,-.31).rotation.x=Math.PI/2;
add(new T.BoxGeometry(.075,.2,.1),mD,0,-.13,.17).rotation.x=.28;
const mag=add(new T.BoxGeometry(.065,.17,.085),mS,0,-.14,.1);
add(new T.BoxGeometry(.1,.1,.13),mS,0,-.17,.2);add(new T.BoxGeometry(.11,.11,.55),mS,.03,-.27,.5).rotation.x=-.2;
const shell=new T.Object3D();shell.position.set(.05,.08,0);gun.add(shell);
gun.position.set(.26,-.27,-.5);cam.add(gun);
const flash=new T.Mesh(new T.SphereGeometry(.07,6,6),new T.MeshBasicMaterial({color:0xffe08a}));flash.position.set(0,.07,-.44);flash.visible=false;gun.add(flash);
// 敌人对象池（共享几何体，不在运行时创建/销毁）
const TY=[{g:new T.BoxGeometry(1.5,1.5,1.5),c:0xff6b81,hp:1,sp:5,pt:10,r:1.1},{g:new T.OctahedronGeometry(1),c:0xffc23f,hp:1,sp:10,pt:25,r:1},{g:new T.IcosahedronGeometry(1.7),c:0xa66bff,hp:3,sp:3,pt:60,r:1.7}];
const pool=TY.map(t=>{const mat=new T.MeshLambertMaterial({color:t.c,emissive:t.c,emissiveIntensity:.35});t.m=mat;const a=[];for(let i=0;i<14;i++){const e=new T.Mesh(t.g,mat);e.visible=false;e.userData={t,on:false,hp:0,hit:0,ph:0};S.add(e);a.push(e)}return a});
let live=[];
// 粒子池
const pg=new T.BoxGeometry(.14,.14,.14),pm=TY.map(t=>new T.MeshBasicMaterial({color:t.c})).concat(new T.MeshBasicMaterial({color:0xe3b04b})),pp=[];
for(let i=0;i<90;i++){const p=new T.Mesh(pg,pm[0]);p.visible=false;p.userData={v:new T.Vector3(),l:0};S.add(p);pp.push(p)}let pi=0;
function burst(pos,ti,n){for(let i=0;i<n;i++){const p=pp[pi++%pp.length],u=p.userData;p.material=pm[ti];p.position.copy(pos);u.v.set(Math.random()-.5,Math.random()*.8,Math.random()-.5).multiplyScalar(9);u.l=.5;p.scale.setScalar(1);p.visible=true}}
const _r=new T.Vector3(),_u=new T.Vector3();
function eject(){const p=pp[pi++%pp.length],u=p.userData;p.material=pm[3];shell.getWorldPosition(p.position);_r.set(1,0,0).applyQuaternion(cam.quaternion);_u.set(0,1,0).applyQuaternion(cam.quaternion);u.v.copy(_r).multiplyScalar(2.5+Math.random()).addScaledVector(_u,2+Math.random());u.l=.7;p.scale.setScalar(1.4);p.visible=true}
// 子弹轨迹池
const tr=[];for(let i=0;i<6;i++){const g=new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3()]),l=new T.Line(g,new T.LineBasicMaterial({color:0xbff3ff,transparent:true}));l.visible=false;l.frustumCulled=false;l.userData.l=0;S.add(l);tr.push(l)}let ti=0;
function tracer(a,b){const l=tr[ti++%tr.length],p=l.geometry.attributes.position;p.setXYZ(0,a.x,a.y,a.z);p.setXYZ(1,b.x,b.y,b.z);p.needsUpdate=true;l.userData.l=.09;l.material.opacity=1;l.visible=true}
// 音效
let ac=null;function snd(f,d,type,vol){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.4,ac.currentTime+d);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
// 状态
let run=false,score=0,hp=100,wave=1,kills=0,combo=0,ammo=15,rel=0,cd=0,spT=0,shake=0,recoil=0,down=false,raf=0,last=0,best=0,fa=0,fc=0;
try{best=+localStorage.getItem('shoot-best')||0}catch(e){}$('bs').textContent=best;
const xh=$('xh'),rctx=$('rd').getContext('2d'),RC=['#ff6b81','#ffc23f','#a66bff'],rc=new T.Raycaster(),nd=new T.Vector2(0,0),hv=new T.Vector3(),mz=new T.Vector3(),sw={x:0,y:0};rc.far=100;
let yaw=0,pitch=0,locked=false,dragId=null,lx=0,ly=0,touchMode=matchMedia('(pointer:coarse)').matches,fallback=touchMode,dY=0,dP=0,kick=0,paused=false,tt=0;
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function look(dx,dy,s){yaw-=dx*s;pitch=Math.max(-1.45,Math.min(1.45,pitch-dy*s));dY-=dx*s;dP-=dy*s}
const canLock=!touchMode&&!!cv.requestPointerLock;
document.addEventListener('mousemove',e=>{if(locked)look(e.movementX,e.movementY,.0022)});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(!locked&&run&&!paused&&!fallback)pause()});
document.addEventListener('pointerlockerror',()=>{fallback=true;$('fb').style.display='block'});
cv.addEventListener('pointerdown',e=>{if(!run)return;if(locked){down=true;fire();return}dragId=e.pointerId;cv.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointermove',e=>{if(dragId===e.pointerId){look(e.clientX-lx,e.clientY-ly,.005);lx=e.clientX;ly=e.clientY}});
addEventListener('pointerup',e=>{down=false;if(e.pointerId===dragId)dragId=null});
$('fb').addEventListener('pointerdown',e=>{e.stopPropagation();down=true;fire()});
addEventListener('keydown',e=>{if(e.code==='KeyR')reload();if(e.code==='Space'){e.preventDefault();fire()}});
function pause(){if(!run||paused)return;paused=true;cancelAnimationFrame(raf);down=false;$('mt').textContent='已暂停';$('ms').textContent='点击继续回到战场。';$('go').textContent='继续游戏';$('menu').style.display='flex'}
function resume(){paused=false;$('menu').style.display='none';if(canLock&&!fallback)cv.requestPointerLock();last=performance.now();raf=requestAnimationFrame(loop)}
$('rl').addEventListener('pointerdown',e=>{e.stopPropagation();reload()});
function reload(){if(!run||rel>0||ammo===15)return;rel=1.1;$('am').textContent='…';snd(220,.2,'sine',.08)}
function fire(){if(!run||cd>0||rel>0)return;if(ammo<=0){reload();return}
ammo--;cd=.13;recoil=.07;shake=Math.max(shake,.04);$('am').textContent=ammo;
rc.setFromCamera(nd,cam);
const h=rc.intersectObjects(live,false),end=h.length?h[0].point:rc.ray.at(60,hv);
flash.getWorldPosition(mz);tracer(mz,end);kick=1;eject();snd(520,.07,'square',.06);
if(h.length){const e=h[0].object,u=e.userData;u.hp--;u.hit=.12;if(u.hp<=0)kill(e,true);else snd(300,.06,'triangle',.07)}
if(ammo<=0)reload()}
function kill(e,pts){const u=e.userData,ix=TY.indexOf(u.t);burst(e.position,ix,12);e.visible=false;u.on=false;const i=live.indexOf(e);if(i>=0){live[i]=live[live.length-1];live.pop()}
if(pts){combo++;const mul=Math.min(5,1+(combo/5|0));score+=u.t.pt*mul;kills++;snd(760,.12,'triangle',.08);if(kills%12===0){wave++;$('wv').textContent=wave}$('sc').textContent=score;$('cb').textContent=combo>=3?'连杀 '+combo+'  ×'+mul:''}}
function spawn(){const w=Math.min(wave,12),r=Math.random();let t=0;if(r<Math.min(.25,.04+w*.02))t=2;else if(r<Math.min(.65,.2+w*.04))t=1;
const e=pool[t].find(x=>!x.userData.on);if(!e)return;const u=e.userData,a=Math.random()*6.2832,d=50+Math.random()*8;
e.position.set(Math.sin(a)*d,1.2+Math.random()*2.6,-Math.cos(a)*d);e.scale.setScalar(1);u.on=true;u.hp=u.t.hp;u.hit=0;u.ph=Math.random()*6;e.visible=true;live.push(e)}
function hurt(n){hp-=n;combo=0;$('cb').textContent='';shake=.3;$('hpf').style.width=Math.max(0,hp)+'%';const f=$('fl');f.style.opacity=.9;setTimeout(()=>f.style.opacity=0,120);snd(110,.25,'sawtooth',.12);if(hp<=0)over()}
function over(){run=false;cancelAnimationFrame(raf);down=false;if(document.exitPointerLock)document.exitPointerLock();let nb='';if(score>best){best=score;nb='，新纪录！';try{localStorage.setItem('shoot-best',best)}catch(e){}$('bs').textContent=best}
$('mt').textContent='阵地失守';$('ms').textContent='得分 '+score+'，击破 '+kills+' 个目标'+nb;$('go').textContent='再来一局';$('menu').style.display='flex'}
function start(){live.forEach(e=>{e.visible=false;e.userData.on=false});live=[];pp.forEach(p=>p.visible=false);
score=0;hp=100;wave=1;kills=0;combo=0;ammo=15;rel=0;cd=0;spT=.5;$('sc').textContent=0;$('wv').textContent=1;$('am').textContent=15;$('cb').textContent='';$('hpf').style.width='100%';$('menu').style.display='none';
run=true;paused=false;yaw=0;pitch=0;if(canLock&&!fallback)cv.requestPointerLock();if(fallback)$('fb').style.display='block';last=performance.now();raf=requestAnimationFrame(loop)}
$('go').addEventListener('click',()=>paused?resume():start());
// 主循环
function loop(now){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
cd-=dt;if(rel>0){rel-=dt;if(rel<=0){ammo=15;$('am').textContent=15}}
if(down)fire();
spT-=dt;if(spT<=0){spawn();spT=Math.max(.3,1.3-wave*.09)}
for(let i=live.length-1;i>=0;i--){const e=live[i],u=e.userData,t=u.t;u.ph+=dt*2;
const d=Math.hypot(e.position.x,e.position.z);if(d<2.4){hurt(u.hp>1?20:10);kill(e,false);continue}
const s=t.sp*(1+wave*.04)*dt/d;e.position.x-=e.position.x*s;e.position.z-=e.position.z*s;e.position.y+=((1.7+Math.sin(u.ph)*.6)-e.position.y)*Math.min(1,dt*1.5);
e.rotation.x+=dt*1.2;e.rotation.y+=dt*1.7;if(u.hit>0){u.hit-=dt;e.scale.setScalar(1.25)}else e.scale.setScalar(1)}
for(const p of pp){if(!p.visible)continue;const u=p.userData;u.l-=dt;if(u.l<=0){p.visible=false;continue}u.v.y-=18*dt;p.position.addScaledVector(u.v,dt);p.scale.setScalar(u.l*2)}
for(const l of tr){if(!l.visible)continue;l.userData.l-=dt;l.material.opacity=Math.max(0,l.userData.l/.09);if(l.userData.l<=0)l.visible=false}
// 相机：平滑跟随瞄准点，带后坐力与震动
tt+=dt;kick=Math.max(0,kick-dt*7);const dk=Math.exp(-9*dt);sw.x=Math.max(-.09,Math.min(.09,sw.x+dY*.5))*dk;sw.y=Math.max(-.09,Math.min(.09,sw.y-dP*.5))*dk;dY=dP=0;
const rp=rel>0?1-rel/1.1:-1;let tl=0,mo=0,sl=0;
if(rp>=0){tl=Math.min(1,rp/.18)*(rp<.85?1:Math.max(0,(1-rp)/.15));mo=rp<.18?0:rp<.42?(rp-.18)/.24:rp<.6?1:rp<.8?1-(rp-.6)/.2:0;sl=rp>.8?Math.sin((rp-.8)/.2*Math.PI):0}
gun.position.set(.26-tl*.05+sw.x*.6,-.27+Math.sin(tt*1.6)*.004-tl*.05+sw.y*.6,-.5+kick*.06);
gun.rotation.set(kick*.14+tl*.35+sw.y*1.2,sw.x*1.5,tl*.5);
slide.position.z=-.02+kick*.08+sl*.08;mag.position.y=-.14-mo*.4;flash.visible=kick>.78;
shake=Math.max(0,shake-dt*1.2);recoil=Math.max(0,recoil-dt*.5);
cam.rotation.y=yaw+(Math.random()-.5)*shake*.06;cam.rotation.x=pitch+recoil+(Math.random()-.5)*shake*.06;

xh.style.transform='scale('+(1+kick*.35)+')';
rctx.clearRect(0,0,96,96);rctx.fillStyle='#0a1226a0';rctx.beginPath();rctx.arc(48,48,47,0,6.283);rctx.fill();
const cy=Math.cos(yaw),sy=Math.sin(yaw);for(const e of live){const x=e.position.x,z=e.position.z;rctx.fillStyle=RC[TY.indexOf(e.userData.t)];rctx.fillRect(48+(x*cy-z*sy)*.75-2,48+(x*sy+z*cy)*.75-2,4,4)}
rctx.fillStyle='#fff';rctx.fillRect(46,46,4,4);
R.render(S,cam);
// 动态分辨率：帧时间过长就降低像素比，空闲时再升回去
fa+=dt;fc++;if(fc===45){const ms=fa/fc*1000;fa=0;fc=0;if(ms>21&&pr>.7){pr=Math.max(.7,pr-.15);R.setPixelRatio(pr);resize()}else if(ms<13&&pr<Math.min(devicePixelRatio||1,1.5)){pr=Math.min(Math.min(devicePixelRatio||1,1.5),pr+.1);R.setPixelRatio(pr);resize()}}}
// 切到后台自动暂停
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run){cancelAnimationFrame(raf);down=false}else if(run&&!paused){last=performance.now();raf=requestAnimationFrame(loop)}});
R.render(S,cam);
})();
</script></body></html>
