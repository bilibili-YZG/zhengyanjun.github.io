<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>15号线大冒险 · 关卡工坊</title>
<link rel="stylesheet" href="editor/editor.css">
</head>
<body>
<div id="lock" class="lock">
  <section class="lock-card">
    <div class="logo">15</div>
    <h1>关卡工坊</h1>
    <p id="lockHint">首次使用请设置一个工坊密码（防止学生误改主线）。</p>
    <input id="password" type="password" placeholder="设置 / 输入密码" autocomplete="current-password">
    <button id="unlock" class="primary">进入工坊</button>
    <small>密码只保存在本机浏览器，仅用于界面锁定；忘记密码可在浏览器中清除本站数据。</small>
  </section>
</div>

<div id="app" class="app hidden">
<header class="top">
  <div class="brand"><span class="badge">15</span><div><b>关卡工坊</b><small id="dirtyInfo">草稿已自动保存</small></div></div>
  <div class="top-actions">
    <button id="undoBtn" title="Ctrl+Z">↶ 撤销</button>
    <button id="redoBtn" title="Ctrl+Y">↷ 重做</button>
    <span class="sep"></span>
    <button id="testBtn" class="accent">▶ 试玩本关</button>
    <button id="publishBtn" class="primary">⬆ 发布到游戏</button>
    <span class="sep"></span>
    <button id="importBtn">导入</button>
    <button id="exportBtn">导出全部</button>
    <button id="exportLevelBtn">导出本关</button>
    <button id="moreBtn">⋯</button>
    <div id="moreMenu" class="menu hidden">
      <button id="resetDefaultBtn">载入默认主线（覆盖草稿）</button>
      <button id="loadPublishedBtn">载入已发布的主线</button>
      <button id="unpublishBtn">游戏恢复使用默认主线</button>
      <a href="index.html" target="_blank">打开游戏 ↗</a>
      <button id="lockBtn">锁定工坊</button>
    </div>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<div class="work">
  <!-- 左：主线结构 / 剧情 -->
  <aside class="side left">
    <div class="tabs"><button data-tab="tree" class="on">主线结构</button><button data-tab="story">开场与结局</button></div>
    <div id="tab-tree" class="tabpane">
      <div id="tree" class="tree"></div>
      <button id="addChapter" class="full dashed">＋ 新增章节</button>
      <div id="chapterPanel" class="card">
        <h3>本章设置</h3>
        <label>章节名<input id="chName"></label>
        <label>副标题（章节选择里显示）<input id="chSub"></label>
        <label>主题/音乐<select id="chBiome"></select></label>
        <label>章节开场剧情 <i>每行一页，可写“场景|文字”</i><textarea id="chIntro" rows="4"></textarea></label>
        <label>章节结束剧情<textarea id="chOutro" rows="4"></textarea></label>
      </div>
    </div>
    <div id="tab-story" class="tabpane hidden">
      <p class="hint">每行一页。行首可写场景名再加竖线：<code>school</code> 学校 · <code>station</code> 站台 · <code>train</code> 车厢 · <code>snow</code> / <code>forest</code> / <code>underground</code> / <code>lava</code>。</p>
      <label>开场（新游戏时播放）<textarea id="prologue" rows="9"></textarea></label>
      <label>结局（最后一章结束后播放）<textarea id="epilogue" rows="9"></textarea></label>
    </div>
  </aside>

  <!-- 中：画布 -->
  <main class="center">
    <div class="toolbar">
      <div class="tools" id="tools">
        <button data-tool="select" class="on" title="V">✥ 选择/移动</button>
        <button data-tool="paint" title="B">▰ 画地块</button>
        <button data-tool="place" title="P">◆ 放置物件</button>
        <button data-tool="erase" title="X">⌫ 橡皮</button>
        <button data-tool="link" title="L">⇢ 机关连线</button>
        <button data-tool="pan" title="空格拖动">✋ 平移</button>
      </div>
      <div class="opts">
        <label>笔刷<select id="brush"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
        <label class="chk"><input id="gridChk" type="checkbox" checked>网格</label>
        <label class="chk"><input id="animChk" type="checkbox">动画</label>
        <button id="zoomOut">－</button><span id="zoomLbl">100%</span><button id="zoomIn">＋</button><button id="fitBtn">适合</button>
      </div>
    </div>
    <div class="stage" id="stage"><canvas id="cv"></canvas><div id="toolHint" class="tool-hint"></div></div>
    <div class="status"><span id="stLevel"></span><span id="stCursor">—</span><span id="stSel"></span><span class="grow"></span><span id="stTip">滚轮缩放 · 中键/空格拖动平移 · 双指缩放</span></div>
  </main>

  <!-- 右：图鉴 / 属性 / 关卡 -->
  <aside class="side right">
    <div class="tabs"><button data-rtab="palette" class="on">图鉴</button><button data-rtab="props">属性</button><button data-rtab="level">本关</button><button data-rtab="check">检查<i id="checkBadge"></i></button></div>
    <div id="rtab-palette" class="tabpane"><div id="palette"></div></div>
    <div id="rtab-props" class="tabpane hidden"><div id="props"><p class="hint">在地图上点选一个物件。</p></div></div>
    <div id="rtab-level" class="tabpane hidden">
      <label>房间名<input id="lvName"></label>
      <div class="two"><label>宽（格）<input id="lvW" type="number" min="20" max="240"></label><label>高（格）<input id="lvH" type="number" min="12" max="60"></label></div>
      <label>改尺寸时对齐<select id="lvAnchor"><option value="bottom">底部对齐（保留地面）</option><option value="top">顶部对齐</option></select></label>
      <label>主题/音乐<select id="lvBg"></select></label>
      <label>目标（HUD 显示）<input id="lvObj"></label>
      <label>入场提示（标题卡副文）<input id="lvIntro"></label>
      <h4>机关连线</h4>
      <p class="hint">开关/压力板 → 闸门/移动平台/升降台/激光栅。同一个目标连了多个开关时，需要全部触发才生效。</p>
      <ul id="linkList" class="links"></ul>
      <button id="clearLevel" class="full danger">清空本关</button>
    </div>
    <div id="rtab-check" class="tabpane hidden"><div id="checks"></div></div>
  </aside>
</div>
</div>
<div id="toast" class="toast"></div>
<script src="js/data/defs.js"></script>
<script src="js/data/level-builder.js"></script>
<script src="js/levels/c1-01.js"></script>
<script src="js/levels/c1-02.js"></script>
<script src="js/levels/c1-03.js"></script>
<script src="js/levels/c1-04.js"></script>
<script src="js/levels/c1-05.js"></script>
<script src="js/levels/c1-06.js"></script>
<script src="js/levels/c2-01.js"></script>
<script src="js/levels/c2-02.js"></script>
<script src="js/levels/c2-03.js"></script>
<script src="js/levels/c2-04.js"></script>
<script src="js/levels/c2-05.js"></script>
<script src="js/levels/c2-06.js"></script>
<script src="js/levels/c3-01.js"></script>
<script src="js/levels/c3-02.js"></script>
<script src="js/levels/c3-03.js"></script>
<script src="js/levels/c3-04.js"></script>
<script src="js/levels/c3-05.js"></script>
<script src="js/levels/c3-06.js"></script>
<script src="js/levels/c4-01.js"></script>
<script src="js/levels/c4-02.js"></script>
<script src="js/levels/c4-03.js"></script>
<script src="js/levels/c4-04.js"></script>
<script src="js/levels/c4-05.js"></script>
<script src="js/levels/c4-06.js"></script>
<script src="js/data/campaign.js"></script>
<script src="js/gfx.js"></script>
<script src="js/gfx2.js"></script>
<script src="js/gfx3.js"></script>
<script src="editor/editor.js"></script>
</body>
</html>
