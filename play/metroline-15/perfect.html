<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>完美存档下载</title>
<style>body{font-family:sans-serif;text-align:center;padding:60px;background:#10202b;color:#eee}button{font-size:20px;padding:14px 32px;cursor:pointer}</style></head>
<body><h2>15号线 · 完美存档</h2><p>主线全部章节解锁、全部碎片、已通关。<br>下载后在游戏 存档 → 某个存档位 → 导入覆盖。</p>
<button id="dl">下载完美存档</button>
<script>
['data/defs','data/level-builder','data/dlc-kit'].forEach(function(s){document.write('<script src="js/'+s+'.js"><\/script>')});
['c1','c2','c3','c4','c5'].forEach(function(c){for(var i=1;i<=(c==='c5'?2:6);i++)document.write('<script src="js/levels/'+c+'-0'+i+'.js"><\/script>')});
[4,4,4].forEach(function(n,c){for(var i=1;i<=n;i++)document.write('<script src="js/levels/d'+(c+1)+'-0'+i+'.js"><\/script>')});
['data/metro-kit'].forEach(function(s){document.write('<script src="js/'+s+'.js"><\/script>')});
for(var i=1;i<=4;i++)document.write('<script src="js/levels/metro1-0'+i+'.js"><\/script>');
['data/campaign','data/dlc-campaign','data/dlc-subway','dlc-registry','data/codex'].forEach(function(s){document.write('<script src="js/'+s+'.js"><\/script>')});
</script>
<script>
document.getElementById('dl').onclick=function(){
 var D=L15_META_DATA,now=Date.now(),m={shards:{},blueShards:{},cnt:{},boss:{},seen:{},ach:{},clears:99,clean:99,legacy:1,dlcUnlocked:true,dlcClears:99,dlcProgress:{},paradoxPerfect:true};
 function scan(c,key,kind,store,ci0){c.chapters.forEach(function(ch,ci){ch.levels.forEach(function(lv,li){
  lv.objects.forEach(function(o){if(o.kind===kind){var k=key+ci+'-'+li;(store[k]||(store[k]={}))[o.id]=1}if(o.kind==='boss')m.boss[(o.props&&o.props.boss)||'lava']=1});
 })})}
 scan(CAMPAIGN_DEFAULT,'','shard',m.shards);
 var dc=window.CAMPAIGN_DLC;
 if(dc){scan(dc,'dlc','blueshard',m.blueShards);dc.chapters.forEach(function(ch,i){m.dlcProgress['ch'+(i+1)]=1})}
 var sw=window.CAMPAIGN_SUBWAY;
 if(sw)scan(sw,'dlc','yellowshard',m.blueShards);
 D.CODEX.forEach(function(e){m.seen[e.k]=now});D.ACH.forEach(function(a){m.ach[a.id]=now});
 var got={},n=0;Object.keys(m.shards).forEach(function(k){got[k]=m.shards[k];n+=Object.keys(m.shards[k]).length});
 var s={ci:CAMPAIGN_DEFAULT.chapters.length-1,li:0,unlocked:CAMPAIGN_DEFAULT.chapters.length-1,shards:n,got:got,stats:{deaths:0,kills:0,time:0},sig:CAMPAIGN_DEFAULT.chapters.map(function(c){return c.levels.length}).join('-'),t:now,cleared:true};
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({game:'metroline-15',slot:s})],{type:'application/json'}));
 a.download='metroline15-perfect-save.json';a.click()};
</script></body></html>
