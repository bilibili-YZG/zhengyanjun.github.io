<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>郑块大PK</title>

<link rel="stylesheet" href="./css/style.css">
</head>

<body>

<!-- 背景 -->
<div id="backgroundFX"></div>
<div id="particles"></div>
<div id="flashLayer"></div>
<div class="scanlines"></div>


<!-- =====================================================
     主菜单
===================================================== -->

<section id="menu" class="screen">

    <div class="menu-aura aura1"></div>
    <div class="menu-aura aura2"></div>

    <div class="logo">

        <div class="logo-mini">
            ZYJ GAME CENTER
        </div>

        <div class="logo-main">
            郑块<span>大PK</span>
        </div>

        <div class="logo-en">
            BLOCK BATTLE
        </div>

    </div>


    <div class="select-title">
        SELECT PLAYERS
    </div>


    <div class="mode-grid">

        <button class="mode-card" data-players="1">

            <span class="mode-index">01</span>

            <div class="mode-symbol">
                ◆
            </div>

            <strong>
                单人练习
            </strong>

            <small>
                SOLO
            </small>

        </button>


        <button class="mode-card" data-players="2">

            <span class="mode-index">02</span>

            <div class="mode-symbol">
                ◆◆
            </div>

            <strong>
                双人 PK
            </strong>

            <small>
                DUEL
            </small>

        </button>


        <button class="mode-card" data-players="3">

            <span class="mode-index">03</span>

            <div class="mode-symbol">
                ◆◆◆
            </div>

            <strong>
                三人混战
            </strong>

            <small>
                TRIPLE
            </small>

        </button>


        <button class="mode-card" data-players="4">

            <span class="mode-index">04</span>

            <div class="mode-symbol">
                ◆◆◆◆
            </div>

            <strong>
                四人乱斗
            </strong>

            <small>
                BATTLE ROYALE
            </small>

        </button>

    </div>


    <div class="menu-tip">
        消除 · 连击 · 道具 · 技能 · 攻击 · K.O.
    </div>

</section>



<!-- =====================================================
     游戏
===================================================== -->

<section id="gameScreen" class="game-screen hidden">

    <header class="topbar">

        <div class="brand">
            郑块<span>大PK</span>
        </div>

        <div id="gameMode"
             class="game-mode">
            DUEL
        </div>

        <div id="timer"
             class="timer">
            03:00
        </div>

        <button id="menuButton"
                class="small-button">
            返回
        </button>

    </header>


    <main id="battle"
          class="battle">
    </main>

</section>



<!-- =====================================================
     倒计时
===================================================== -->

<div id="countdown"
     class="countdown hidden">

    <div id="countdownNumber">
        3
    </div>

</div>



<!-- =====================================================
     战斗提示
===================================================== -->

<div id="battleAnnouncement"
     class="battle-announcement">

    <div id="announcementText"></div>

</div>



<!-- =====================================================
     结果
===================================================== -->

<section id="resultScreen"
         class="screen hidden">

    <div class="result-card">

        <div class="result-label">
            BATTLE RESULT
        </div>

        <div id="winnerText"
             class="winner">
            PLAYER 1
        </div>

        <div id="winnerSub"
             class="winner-sub">
            VICTORY
        </div>

        <div id="finalScores"
             class="final-scores">
        </div>

        <div class="result-buttons">

            <button id="againButton"
                    class="primary-button">
                再来一局
            </button>

            <button id="resultMenuButton"
                    class="secondary-button">
                返回选人
            </button>

        </div>

    </div>

</section>


<script src="./js/effects.js"></script>
<script src="./js/tetris.js"></script>
<script src="./js/game.js"></script>

</body>
</html>
