<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>娱乐小游戏</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --red: #ef4444;
      --red-2: #f87171;
      --blue: #3b82f6;
      --blue-2: #60a5fa;
      --yellow: #fde047;
      --green: #22c55e;
      --text: #f8fafc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, var(--bg-2), var(--bg-1) 75%);
      color: var(--text);
      font-family: "Noto Sans SC", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    h1.title {
      font-size: 2.2rem;
      font-weight: 900;
      margin: 0 0 .6rem;
      letter-spacing: .08em;
      background: linear-gradient(90deg, var(--red-2), var(--yellow), var(--blue-2));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
      text-align: center;
    }
    @keyframes shine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1rem;
      letter-spacing: .1em;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .app-list {
      width: min(680px, 94vw);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.4rem 1.6rem;
      border-radius: 20px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #ffffff14;
      box-shadow:
        0 8px 30px #00000055,
        inset 0 0 30px #00000033;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: all .25s ease;
      position: relative;
      overflow: hidden;
    }
    .app-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, #ffffff08, transparent);
      transform: translateX(-100%);
      transition: transform .6s ease;
      pointer-events: none;
    }
    .app-card:hover::before {
      transform: translateX(100%);
    }
    .app-card:hover {
      transform: translateY(-4px);
      border-color: #fde04755;
      box-shadow:
        0 14px 40px #00000077,
        0 0 30px #fde04733,
        inset 0 0 30px #00000033;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: linear-gradient(135deg, var(--red), var(--blue));
      box-shadow: inset 0 2px 6px #ffffff44, inset 0 -2px 6px #00000055;
      flex-shrink: 0;
    }
    .app-icon.green  { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .app-icon.yellow { background: linear-gradient(135deg, #fde047, #f59e0b); }
    .app-icon.purple { background: linear-gradient(135deg, #a855f7, #7c3aed); }
    .app-icon.cyan   { background: linear-gradient(135deg, #22d3ee, #0891b2); }

    .app-info {
      flex: 1;
      min-width: 0;
    }
    .app-name {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: .3rem;
      letter-spacing: .04em;
    }
    .app-desc {
      font-size: .9rem;
      color: #94a3b8;
      line-height: 1.6;
    }
    .app-tag {
      display: inline-block;
      margin-top: .4rem;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      background: #ffffff10;
      border: 1px solid #ffffff22;
      color: #cbd5e1;
      letter-spacing: .05em;
    }

    .app-arrow {
      font-size: 1.5rem;
      color: #475569;
      transition: all .25s ease;
      flex-shrink: 0;
    }
    .app-card:hover .app-arrow {
      color: var(--yellow);
      transform: translateX(4px);
    }

    .footer {
      margin-top: 3rem;
      font-size: .85rem;
      color: #475569;
      text-align: center;
      letter-spacing: .05em;
    }

    @media(max-width:520px) {
      h1.title { font-size: 1.6rem; }
      .subtitle { font-size: .9rem; margin-bottom: 1.8rem; }
      .app-card { padding: 1.1rem 1.2rem; gap: 1rem; }
      .app-icon { width: 54px; height: 54px; font-size: 1.6rem; }
      .app-name { font-size: 1.1rem; }
      .app-desc { font-size: .82rem; }
    }
  </style>
</head>
<body>
  <h1 class="title">娱乐小游戏</h1>
  <p class="subtitle">课间放松 · 多人开黑</p>

  <div class="app-list">

    <!-- 应用 1：斗兽棋 -->
    <a class="app-card" href="/play/chess/">
      <div class="app-icon">🐘</div>
      <div class="app-info">
        <div class="app-name">斗兽棋 · 郑艳军大战刘刚</div>
        <div class="app-desc">标准斗兽棋规则 · 每步限时 30 秒 · 攻破对方大本营</div>
        <span class="app-tag">双人对战</span>
      </div>
      <div class="app-arrow">→</div>
    </a>

    <!-- 应用 2：俄罗斯方块 -->
    <a class="app-card" href="/play/tetris/">
      <div class="app-icon cyan">🧱</div>
      <div class="app-info">
        <div class="app-name">郑块消消乐</div>
        <div class="app-desc">乐</div>
        <span class="app-tag">1-4人游玩</span>
      </div>
      <div class="app-arrow">→</div>
    </a>

    <!-- 应用 3：15号线大冒险 -->
    <a class="app-card" href="/play/metroline-15/">
      <div class="app-icon purple">🚇</div>
      <div class="app-info">
        <div class="app-name">15号线大冒险</div>
        <div class="app-desc">一位老师归家的故事</div>
        <span class="app-tag">策略 · 剧情</span>
      </div>
      <div class="app-arrow">→</div>
    </a>

    <!-- 以后加新游戏，照着上面复制一份改改就行 -->

  </div>

  <div class="footer">© 娱乐小游戏 · 持续更新中</div>
</body>
</html>
