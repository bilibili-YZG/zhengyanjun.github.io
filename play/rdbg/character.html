<div class="bar" id="bar">
 <button data-m="peace" class="on">比耶</button>
 <button data-m="wave">挥手</button>
 <button data-m="walk">行走</button>
 <button data-m="stand">站立</button>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var SKIN='#f0c4a0',LINE='#7a4a36';

/* ---------- 手：朝 +y 方向绘制；sx=-1 时水平镜像 ---------- */
function stroke(x1,y1,x2,y2,w){
 return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+LINE+'" stroke-width="'+(w+2.6)+'"/>'+
        '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+SKIN+'" stroke-width="'+w+'"/>'}
var PALM='<ellipse cx="0" cy="12" rx="12.5" ry="13.5" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="1.6"/>';
var HANDS={
 v:PALM+stroke(-5,20,-16,52,7)+stroke(4,20,14,53,7)+
   '<ellipse cx="9" cy="25" rx="6" ry="7.5" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="1.4"/>'+
   stroke(-10,14,2,31,6.5)+'<path d="M-13 50 L-17 54 M12 51 L15 56" stroke="#fff" stroke-width="0"/>',
 open:PALM+stroke(-9,20,-15,46,6.5)+stroke(-3,22,-3,50,6.5)+stroke(4,21,9,48,6.5)+stroke(9,17,18,38,6)+stroke(-10,8,-24,26,7),
 relaxed:PALM+'<ellipse cx="0" cy="26" rx="11" ry="8.5" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="1.5"/>'+
   '<path d="M-4 20 L-4 31 M3 20 L3 31" stroke="'+LINE+'" stroke-width="1.1" opacity=".7"/>'+
   '<ellipse cx="-9" cy="21" rx="4.4" ry="7" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="1.4"/>'};
function setHand(el,type,sx){el.setAttribute('transform','translate(0 80) scale('+sx+' 1)');el.innerHTML=HANDS[type]}
var handType={L:'v',R:'v'};
function applyHands(L,R){if(handType.L!==L){handType.L=L;setHand($('handL'),L,1)}if(handType.R!==R){handType.R=R;setHand($('handR'),R,-1)}}
setHand($('handL'),'v',1);setHand($('handR'),'v',-1);

/* ---------- 动作：返回各关节目标角度（度） ---------- */
var mode='peace';
function pose(t){
 var s=Math.sin,p={};
 if(mode==='peace'){ // 参考图：一手举起比耶，一手伸出比耶，身体微悬空
  p.lUp=125+s(t*2.2)*3;p.lFore=45+s(t*3.1)*6;p.rUp=-66+s(t*2+1)*3;p.rFore=-9+s(t*2.7)*6;
  p.lT=5+s(t*2)*2;p.lS=-6+s(t*2.4)*3;p.rT=-7+s(t*2+1)*2;p.rS=16+s(t*2.2)*4;
  p.bob=-12+s(t*2)*-5;p.lean=s(t*1.5)*1.2;p.tilt=-6+s(t*1.3)*2;p.hl='v';p.hr='v'}
 else if(mode==='wave'){
  p.lUp=142;p.lFore=18+s(t*8)*24;p.rUp=-7;p.rFore=12;
  p.lT=2;p.lS=-2;p.rT=-2;p.rS=3;p.bob=s(t*1.8)*-2;p.lean=s(t*1.6)*1;p.tilt=4+s(t*1.3)*2;p.hl='open';p.hr='relaxed'}
 else if(mode==='walk'){
  var ph=t*5.2,a=s(ph),b=s(ph+Math.PI);
  p.lUp=7-a*28;p.lFore=-14-Math.max(0,a)*22;p.rUp=-7-b*28;p.rFore=14+Math.max(0,b)*22;
  p.lT=a*30;p.lS=Math.max(0,-s(ph+1.2))*38;p.rT=b*30;p.rS=Math.max(0,-s(ph+Math.PI+1.2))*38;
  p.bob=-Math.abs(s(ph))*7;p.lean=a*2;p.tilt=s(ph*.5)*2;p.hl='relaxed';p.hr='relaxed'}
 else{ // stand
  p.lUp=8+s(t*1.6)*1.5;p.lFore=-14;p.rUp=-8-s(t*1.6)*1.5;p.rFore=14;
  p.lT=1;p.lS=0;p.rT=-1;p.rS=0;p.bob=s(t*1.6)*-1.5;p.lean=s(t*.9)*.8;p.tilt=s(t*.8)*1.5;p.hl='relaxed';p.hr='relaxed'}
 return p}

var K=['lUp','lFore','rUp','rFore','lT','lS','rT','rS','bob','lean','tilt'];
var cur={};K.forEach(function(n){cur[n]=pose(0)[n]});

/* ---------- 眨眼 + 眼神跟随 ---------- */
var blink=0,nextBlink=1.5,mx=0,my=0;
window.addEventListener('pointermove',function(e){
 var r=$('head').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.1;
 var dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/300);
 mx=dx/d*k*3;my=dy/d*k*2});
function eyes(t,dt){
 nextBlink-=dt;if(nextBlink<=0){blink=.16;nextBlink=2+Math.random()*3.5}
 var sy=1;if(blink>0){blink-=dt;var u=blink/.16;sy=Math.max(.08,Math.abs(u*2-1))}
 ['eyeL','eyeR'].forEach(function(id){$(id).firstElementChild.setAttribute('transform','translate(0 134) scale(1 '+sy+') translate(0 -134)')});
 $('irisL').setAttribute('transform','translate('+mx+' '+my+')');$('irisR').setAttribute('transform','translate('+mx+' '+my+')')}

/* ---------- 主循环 ---------- */
var last=performance.now(),T=0;
function frame(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 var tg=pose(T),k=1-Math.exp(-dt*9);
 K.forEach(function(n){cur[n]+=(tg[n]-cur[n])*k});
 applyHands(tg.hl,tg.hr);
 $('armL').setAttribute('transform','translate(176 236) rotate('+cur.lUp+')');
 $('foreL').setAttribute('transform','translate(0 88) rotate('+cur.lFore+')');
 $('armR').setAttribute('transform','translate(304 236) rotate('+cur.rUp+')');
 $('foreR').setAttribute('transform','translate(0 88) rotate('+cur.rFore+')');
 $('legL').setAttribute('transform','translate(214 446) rotate('+cur.lT+')');
