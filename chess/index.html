<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>郑艳军大战刘刚 · 斗兽棋</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="forgame">
    <h1>郑艳军 大战 刘刚</h1>
    <div id="animal-chess"></div>
    <div id="btnGroup">
      <label id="player" class="red">下一个：郑艳军</label>
      <button onclick="restartGame()">🔄 重新开始</button>
    </div>
  </div>

  <div id="rules">
    <h2>规则</h2>
    <ul>
      <li>自强至弱：象、狮、虎、豹、狼、狗、猫、鼠</li>
      <li>强吃弱，<b>鼠吃象</b>；同级互吃同归于尽</li>
      <li><b>狮、虎</b>可跳过河（无鼠挡路时），并吃掉对岸弱子</li>
      <li><b>鼠</b>可以游过河；其他动物只能陆地走一格</li>
      <li>不可走进己方兽穴</li>
      <li>走进敌方陷阱，失去战斗力，对方任意棋子可吃</li>
      <li>郑艳军先手，走进对方兽穴获胜</li>
    </ul>
  </div>

  <script src="./game.js"></script>
  <script>
    function playerChanged(color) {
      let ele = document.getElementById("player");
      ele.classList.remove("red");
      ele.classList.remove("blue");
      ele.classList.add(color);
      ele.textContent = "下一个：" + (color === "red" ? "郑艳军" : "刘刚");
    }

    function restartGame() {
      let ele = document.getElementById("animal-chess");
      ele.innerHTML = "";
      new document.GameController(function (msg) {
        if (window.showWinner) window.showWinner(msg);
      }, playerChanged);
    }

    new document.GameController(function (msg) {
      if (window.showWinner) window.showWinner(msg);
    }, playerChanged);
  </script>
</body>
</html>
